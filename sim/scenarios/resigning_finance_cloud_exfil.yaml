scenario_id: resigning_finance_cloud_exfil
description: "Finance employee on notice stages client files, uploads to personal cloud at night"
actor:
  role: Finance
  count: 1
  flags: [notice_period]
phases:
  - stage: collection
    start_day: 8
    duration_days: 2
    internal_read_mb_per_day: 1500
    hours: [10, 18]
  - stage: exfiltration
    start_day: 10
    duration_days: 1
    upload_mb: 1800
    hours: [1, 3]
    destination:
      domain: "megashare-demo.net"
      category: cloud_storage
      first_seen: true
    protocol: https
    pattern: burst
evasion:
  padding: 0.0
  jitter: 0.0
  chunk_mb: null
labels:
  is_malicious: true
  split: train
